[project]
name = "vobiz-ai-calling-agent"
version = "0.1.0"
description = "Inbound AI phone agent bridge for Vobiz and OpenAI Realtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<16",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uvicorn]
factory = false
